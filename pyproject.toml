[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "unifi-rules-to-all-private-zones"
version = "0.1.0"
description = "Push firewall policies across multiple zones on a UDM Pro via the UniFi Integration API."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"

[project.urls]
Homepage = "https://github.com/disappointingsupernova/Unifi-Rules-to-All-Private-Zones"
Repository = "https://github.com/disappointingsupernova/Unifi-Rules-to-All-Private-Zones"
Issues = "https://github.com/disappointingsupernova/Unifi-Rules-to-All-Private-Zones/issues"
Changelog = "https://github.com/disappointingsupernova/Unifi-Rules-to-All-Private-Zones/blob/main/CHANGELOG.md"
dependencies = [
    "requests>=2.31.0",
    "urllib3>=2.0.0",
    "questionary>=2.0.1",
    "rich>=13.7.0",
    "pyyaml>=6.0.1",
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
unifi-manager = "src.unifi_manager.__main__:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]
